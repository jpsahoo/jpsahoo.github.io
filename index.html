
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jyoti Prakash Sahoo | Quantum AI</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f6ff;
            font-family: Arial, sans-serif;
            text-align: center;
            color: #172554;
        }

        .container {
            padding: 40px;
        }

        .quantum {
            width: 110px;
            height: 110px;
            margin: 35px auto;
            position: relative;
            display: grid;
            place-items: center;
        }

        .core {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #2563eb;
            box-shadow: 0 0 30px #38bdf8;
            animation: pulse 1.5s infinite;
        }

        .orbit {
            position: absolute;
            width: 105px;
            height: 40px;
            border: 2px solid #60a5fa;
            border-radius: 50%;
            animation: rotate 3s linear infinite;
        }

        .orbit:nth-child(3) {
            animation-duration: 4s;
            border-color: #a78bfa;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        @keyframes pulse {
            50% { transform: scale(1.3); }
        }

        h1 {
            font-size: 27px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        a {
            color: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

   

  

    <div class="quantum">
        <div class="core"></div>
        <div class="orbit"></div>
        <div class="orbit"></div>
    </div>

     

     

    
</div>


<script>
    function openWebsite() {
        window.open(
            "https://jpsahoo.pages.dev/",
            "_blank"
        );
    }

    // Show quantum loader for 2 seconds, then redirect
    window.addEventListener("load", function () {
        setTimeout(function () {
            window.location.href = "https://jpsahoo.pages.dev/";
        }, 2000);
    });
</script>

</body>
</html>
